name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Fehler zusammenfassen
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "error:|warning: \[|What went wrong|Could not|Caused by|> " -A3 build.log | grep -v "^\s*at " | head -80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build-Fehler::$msg"
      - name: Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nuit-chains
          path: build/libs/*.jar
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nuit Chains (neuester Build)
          prerelease: false
          make_latest: true
          files: build/libs/nuit-chains-*.jar
