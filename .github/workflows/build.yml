name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nuit-chains
          path: build/libs/*.jar
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nuit Chains (neuester Build)
          prerelease: false
          make_latest: true
          files: build/libs/nuit-chains-*.jar
