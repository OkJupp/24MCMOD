name: Inspect Minecraft sources

on:
  push:
    branches: [inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Decompile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew tasks --all > tasks.txt 2>&1 || true
          T=$(grep -oE "^genSources[A-Za-z]*" tasks.txt | head -1)
          echo "task=$T"
          ./gradlew ${T:-genSources} --stacktrace > gen.log 2>&1 || (tail -50 gen.log; exit 1)
      - name: Collect sources
        shell: bash
        run: |
          mkdir -p out
          cp tasks.txt out/
          find ~/.gradle .gradle build -name "*.jar" 2>/dev/null | grep -iE "minecraft|nuit" > out/jars.txt || true
          SRC=$(find ~/.gradle .gradle build -name "*sources*.jar" 2>/dev/null | grep -i minecraft | head -1)
          echo "src=$SRC" >> out/jars.txt
          mkdir -p src_all && cd src_all && unzip -q -o "$SRC" && cd ..
          find src_all -name "*.java" | sed 's|^src_all/||' | sort > out/all_classes.txt
          for c in net/minecraft/client/renderer/LevelRenderer net/minecraft/client/renderer/GameRenderer \
                   net/minecraft/client/renderer/CloudRenderer net/minecraft/client/renderer/RenderPipelines \
                   net/minecraft/client/renderer/SkyRenderer net/minecraft/client/Camera \
                   net/minecraft/client/renderer/fog/FogRenderer net/minecraft/client/renderer/rendertype/RenderTypes \
                   net/minecraft/client/renderer/rendertype/RenderType net/minecraft/client/renderer/rendertype/RenderSetup \
                   net/minecraft/client/renderer/state/level/LevelRenderState net/minecraft/client/renderer/state/level/CameraRenderState \
                   net/minecraft/client/renderer/SubmitNodeCollector net/minecraft/client/renderer/feature/FeatureRenderDispatcher \
                   com/mojang/renderpearl/api/pipeline/RenderPipeline com/mojang/renderpearl/api/pipeline/DepthStencilState \
                   net/minecraft/client/CloudStatus net/minecraft/client/Options; do
            f=src_all/$c.java; [ -f "$f" ] && mkdir -p out/$(dirname $c) && cp "$f" out/$c.java || echo "missing $c" >> out/missing.txt
          done
          grep -rl "class .*SubmitNodeCollector\|interface SubmitNodeCollector" src_all | head -5 >> out/jars.txt || true
          ls src_all/net/minecraft/client/renderer/ > out/renderer_dir.txt
      - name: Push to inspect-out
        shell: bash
        run: |
          cd out
          git init -q -b inspect-out
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "inspect"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" inspect-out
